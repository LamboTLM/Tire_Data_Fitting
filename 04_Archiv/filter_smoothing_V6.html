<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tire Telemetry Controls</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #111111;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        /* ── Layout ─────────────────────────────── */
        .sidebar {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
            background: #111111;
        }

        /* ── Header ─────────────────────────────── */
        .header {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #151515;
            border-bottom: 1px solid #222;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-icon { color: #c72229; display: flex; align-items: center; }
        .header-title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #f0f0f0;
        }
        .header-settings { color: #555; display: flex; align-items: center; cursor: pointer; }
        .header-settings:hover { color: #888; }

        /* ── Scroll area ─────────────────────────── */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px;
        }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-track { background: #111; }
        .content::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .content::-webkit-scrollbar-thumb:hover { background: #555; }

        /* ── Sections ────────────────────────────── */
        .section { margin-bottom: 28px; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #666;
        }
        .section-title svg { color: #555; }

        /* ── Cards ───────────────────────────────── */
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            padding: 10px;
            margin-bottom: 6px;
            transition: border-color 0.15s;
        }
        .card.active-border { border-color: #3a2020; }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .card-top-left { display: flex; align-items: center; gap: 10px; }

        .card-divider {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        /* ── Inputs / Selects ────────────────────── */
        select, input[type="text"], input[type="number"] {
            background: #111111;
            color: #cccccc;
            border: 1px solid #333;
            border-radius: 2px;
            padding: 4px 7px;
            font-size: 11px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
            appearance: none;
            -webkit-appearance: none;
        }
        select:focus, input:focus { border-color: #c72229; }

        .channel-select {
            background: transparent;
            border: none;
            color: #f0f0f0;
            font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            padding: 0;
            width: 90px;
        }
        .channel-select option { background: #1a1a1a; }

        .channel-select.dimmed { color: #555; }

        .full-select {
            width: 100%;
            padding: 5px 7px;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .full-select option { background: #1a1a1a; }

        .input-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .input-pair.single { grid-template-columns: 1fr; }

        .param-field {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #111;
            border: 1px solid #333;
            border-radius: 2px;
            padding: 0 7px;
            transition: border-color 0.15s;
        }
        .param-field:focus-within { border-color: #c72229; }
        .param-label {
            font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
            font-size: 9px;
            color: #555;
            white-space: nowrap;
            min-width: 18px;
        }
        .param-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #f0f0f0;
            font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
            font-size: 11px;
            padding: 5px 0;
            outline: none;
            width: 100%;
        }

        /* Filter value inputs */
        .filter-inputs { display: flex; gap: 6px; }
        .filter-inputs input {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            border-radius: 2px;
            padding: 5px 7px;
            font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
            font-size: 11px;
            color: #f0f0f0;
            outline: none;
            transition: border-color 0.15s;
        }
        .filter-inputs input:focus { border-color: #c72229; }
        .filter-inputs input.hidden { display: none; }

        /* ── Buttons ─────────────────────────────── */
        .delete-btn {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            padding: 4px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            transition: color 0.15s, background 0.15s;
            line-height: 0;
        }
        .delete-btn:hover { color: #c72229; background: #2a1111; }

        .add-btn {
            width: 100%;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 11px;
            color: #555;
            background: transparent;
            border: 1px dashed #333;
            border-radius: 2px;
            cursor: pointer;
            transition: color 0.15s, background 0.15s, border-color 0.15s;
        }
        .add-btn:hover { color: #ccc; background: #1a1a1a; border-color: #555; }

        /* ── Active toggle (smoothing) ───────────── */
        .active-toggle {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            border: 1px solid #444;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            flex-shrink: 0;
        }
        .active-toggle.on { background: #c72229; border-color: #c72229; }
        .active-toggle svg { display: none; }
        .active-toggle.on svg { display: block; }

        /* ── Inactive overlay ────────────────────── */
        .inactive-body { opacity: 0.4; pointer-events: none; }

        /* ── Unused toggle (pill switch) ─────────── */
        .unused-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .unused-text {
            font-size: 9px;
            color: #555;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.15s;
        }
        .unused-label:hover .unused-text { color: #aaa; }

        .pill-track {
            width: 26px;
            height: 14px;
            border-radius: 7px;
            background: #222;
            border: 1px solid #333;
            position: relative;
            transition: background 0.2s;
        }
        .pill-track.on { background: #3a1a1a; border-color: #c72229; }
        .pill-thumb {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            transition: transform 0.2s, background 0.2s;
        }
        .pill-track.on .pill-thumb { transform: translateX(12px); background: #c72229; }

        /* ── Footer ──────────────────────────────── */
        .footer {
            flex: none;
            padding: 12px 14px;
            background: #151515;
            border-top: 1px solid #222;
        }
        .submit-btn {
            width: 100%;
            background: #c72229;
            color: white;
            border: none;
            border-radius: 2px;
            padding: 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
            box-shadow: 0 0 15px rgba(199,34,41,0.2);
        }
        .submit-btn:hover { background: #e0262e; box-shadow: 0 0 22px rgba(199,34,41,0.4); }
        .submit-btn:active { background: #a51c22; }

        /* ── SVG icons (inline) ──────────────────── */
        .icon { display: inline-flex; align-items: center; }

        /* ═══════════════════════════════════════════════════════════════
           FILTER TOOLTIPS
           Erscheint nach 3 s Verweilen über dem Smoothing-Typ-Select.
           Nutzt position:fixed → überlebt overflow:hidden der Sidebar.
        ═══════════════════════════════════════════════════════════════ */
        .ttc-tooltip {
            position: fixed;
            width: 300px;
            background: #141414;
            border: 1px solid #2e2e2e;
            border-radius: 4px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.72), 0 2px 8px rgba(0,0,0,0.5);
            z-index: 9999;
            pointer-events: none;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .ttc-tooltip.visible {
            opacity: 1;
            transform: translateX(0);
        }
        .ttc-accent        { height: 2px; background: linear-gradient(90deg,#c72229,#7a1015); }
        .ttc-header        { padding: 9px 12px 8px; border-bottom: 1px solid #1e1e1e; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
        .ttc-name          { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: #f0f0f0; text-transform: uppercase; }
        .ttc-badge         { font-size: 9px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; border-radius: 2px; padding: 2px 5px; }
        .ttc-badge-red     { color: #c72229; background: rgba(199,34,41,.1); border: 1px solid rgba(199,34,41,.25); }
        .ttc-badge-gray    { color: #555; background: #1a1a1a; border: 1px solid #2a2a2a; }
        .ttc-body          { padding: 8px 12px 0; }
        .ttc-desc          { font-size: 10px; color: #9a9a9a; line-height: 1.55; margin-bottom: 6px; }
        .ttc-desc strong   { color: #ccc; font-weight: 500; }
        .ttc-ei-label      { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: #555; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .ttc-ei-text       { font-size: 10px; color: #9a9a9a; line-height: 1.55; margin-bottom: 8px; }
        .ttc-ei-text strong{ color: #ccc; font-weight: 500; }
        .ttc-chart-wrap    { margin: 0 12px 6px; background: #0e0e0e; border: 1px solid #1e1e1e; border-radius: 3px; overflow: hidden; }
        .ttc-chart-wrap svg{ display: block; }
        .ttc-pbar          { margin: 0 12px 10px; padding: 5px 8px; background: #0e0e0e; border: 1px solid #1e1e1e; border-radius: 3px; display: flex; align-items: center; gap: 6px; }
        .ttc-pitem         { flex: 1; display: flex; align-items: center; gap: 5px; }
        .ttc-pkey          { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9px; color: #555; }
        .ttc-pval          { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 700; color: #f0f0f0; min-width: 22px; text-align: center; }
        .ttc-punit         { font-size: 9px; color: #333; }
        .ttc-pnote         { font-size: 8.5px; color: #444; border-left: 1px solid #1e1e1e; padding-left: 8px; line-height: 1.4; max-width: 80px; text-align: right; flex-shrink: 0; }
        .ttc-psep          { width: 1px; height: 18px; background: #222; flex-shrink: 0; }
        .ttc-footer        { padding: 5px 12px; border-top: 1px solid #1a1a1a; display: flex; align-items: center; gap: 6px; }
        .ttc-footer-txt    { font-size: 8.5px; color: #333; letter-spacing: .06em; }

        /* Roter Fortschrittsbalken am unteren Rand des Select-Wrappers */
        .ttc-progress {
            position: absolute;
            bottom: 0; left: 0;
            height: 2px;
            width: 0%;
            background: linear-gradient(90deg, #c72229, #ff5555);
            pointer-events: none;
            border-radius: 0 1px 1px 0;
        }
        /* Wrapper um das type-select für Progress-Bar-Positionierung */
        .ttc-select-wrap {
            position: relative;
            margin-bottom: 6px;
        }
        .ttc-select-wrap .full-select {
            margin-bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="header-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
            </span>
            <span class="header-title">Tire Telemetry</span>
        </div>
        <span class="header-settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="21" y1="4" x2="7" y2="4"/><line x1="3" y1="4" x2="3" y2="4"/>
                <line x1="21" y1="12" x2="11" y2="12"/><line x1="7" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="20" x2="17" y2="20"/><line x1="13" y1="20" x2="3" y2="20"/>
                <circle cx="3.5" cy="4" r="1.5"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="20" r="2"/>
            </svg>
        </span>
    </div>

    <!-- Scrollable content -->
    <div class="content">

        <!-- FILTER SECTION -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                    </svg>
                    Data Filters
                </span>
            </div>
            <div id="filterContainer"></div>
            <button class="add-btn" onclick="addFilter()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Add Filter
            </button>
        </div>

        <!-- SMOOTHING SECTION -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    Smoothing
                </span>
                <label class="unused-label" onclick="toggleUnused()">
                    <span class="unused-text">Unused</span>
                    <div class="pill-track" id="unusedTrack">
                        <div class="pill-thumb"></div>
                    </div>
                </label>
            </div>
            <div id="smoothingContainer"></div>
            <button class="add-btn" onclick="addSmoothing()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Add Smoothing
            </button>
        </div>

        <!-- PRESET RESET -->
        <div class="section">
            <button class="add-btn" onclick="resetToRecommended()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                </svg>
                Reset to Recommended
            </button>
        </div>

    </div><!-- /content -->

    <!-- Footer -->
    <div class="footer">
        <button class="submit-btn" onclick="sendToMatlab()">Aktualisieren</button>
    </div>
</div>

<script>
    /* ================================================================
       DATA CONTRACT (JS -> MATLAB via htmlComponent.Data):
       {
         hideUnused: bool,
         filters: [{ parameter, condition, val1, val2 }],
             - 'Lowerbound (>=)' / 'Upperbound (<=)' / 'Gleich (==)' /
               'Ungleich (!=)'          : val1 = Wert, val2 unbenutzt
             - 'Bereich [min,max]'      : val1 = min,  val2 = max
             - 'Band um Nominal [±%]'   : val1 = Toleranz [%], val2 unbenutzt
                                          (Nominal-Raster liegt im MATLAB-Backend)
             - 'Band um Peak [±%]'      : val1 = Toleranz [%] unterhalb des
                                          Kanal-Peaks ueber alle Sweeps
             - 'Band um Wert [±%]'      : val1 = Referenzwert, val2 = Toleranz [%]
         smoothings: [{ parameter, active, type, param1, param2 }]
             - Butterworth    : param1 = Ordnung N,  param2 = fc [Hz]
             - Bessel         : param1 = Ordnung N,  param2 = fc [Hz]
             - Savitzky-Golay : param1 = Ordnung,    param2 = Fenster
             - Moving Average : param1 = Fenster
             - Median         : param1 = Fenster
             - Hampel         : param1 = Fenster,    param2 = n-Sigma
       ================================================================ */

    /* ── Constants ───────────────────────────────────────── */
    const CHANNELS = ['alpha','kappa','Fx','Fy','Fz','Mx','Mz','IP','gamma','V','omega','TtreadI','TtreadC','TtreadO'];
    const FILTER_CONDITIONS = [
        'Lowerbound (>=)','Upperbound (<=)','Bereich [min,max]','Gleich (==)','Ungleich (!=)',
        'Band um Nominal [±%]','Band um Peak [±%]','Band um Wert [±%]'
    ];
    const SMOOTHING_TYPES = ['Butterworth','Bessel','Savitzky-Golay','Moving Average','Median','Hampel'];

    /* Bedingungen mit zwei sichtbaren Eingabefeldern + Platzhaltertexte */
    const CONDITION_INPUTS = {
        'Lowerbound (>=)':      { two: false, ph1: 'value' },
        'Upperbound (<=)':      { two: false, ph1: 'value' },
        'Bereich [min,max]':    { two: true,  ph1: 'min',  ph2: 'max' },
        'Gleich (==)':          { two: false, ph1: 'value' },
        'Ungleich (!=)':        { two: false, ph1: 'value' },
        'Band um Nominal [±%]': { two: false, ph1: 'Tol %' },
        'Band um Peak [±%]':    { two: false, ph1: 'Tol %' },
        'Band um Wert [±%]':    { two: true,  ph1: 'Ref',  ph2: 'Tol %' }
    };

    /* ── Empfohlene Presets ──────────────────────────────────
       Physikalische Basis: Sweep-Anregung am Flat-Trac ~0.25-1 Hz.
       fc >= 10x Sweep-Frequenz erhaelt Peaks (Fy_max, Mz-Spitze).
       alpha/kappa NICHT tiefpassfiltern -> kein Phasenversatz der
       Kennfeld-x-Achse. filtfilt im Backend = null Phase ueberall. */
    const DEFAULT_SMOOTHINGS = [
        { channel: 'Fz',      active: true,  type: 'Butterworth',    param1: '4',   param2: '5'  },
        { channel: 'Fy',      active: true,  type: 'Butterworth',    param1: '4',   param2: '10' },
        { channel: 'Fx',      active: true,  type: 'Butterworth',    param1: '4',   param2: '10' },
        { channel: 'Mz',      active: true,  type: 'Butterworth',    param1: '4',   param2: '5'  },
        { channel: 'Mx',      active: true,  type: 'Butterworth',    param1: '4',   param2: '5'  },
        { channel: 'alpha',   active: true,  type: 'Median',         param1: '5',   param2: ''   },
        { channel: 'kappa',   active: true,  type: 'Median',         param1: '5',   param2: ''   },
        { channel: 'IP',      active: true,  type: 'Moving Average', param1: '51',  param2: ''   },
        { channel: 'TtreadI', active: true,  type: 'Moving Average', param1: '101', param2: ''   },
        { channel: 'TtreadC', active: true,  type: 'Moving Average', param1: '101', param2: ''   },
        { channel: 'TtreadO', active: true,  type: 'Moving Average', param1: '101', param2: ''   },
        { channel: 'V',       active: true,  type: 'Hampel',         param1: '7',   param2: '3'  },
        { channel: 'omega',   active: true,  type: 'Hampel',         param1: '7',   param2: '3'  }
    ];

    /* Qualitaets-Basisfilter */
    const DEFAULT_FILTERS = [
        { channel: 'TtreadC', condition: 'Band um Peak [±%]',    val1: '25', val2: ''  },
        { channel: 'Fz',      condition: 'Lowerbound (>=)',      val1: '50', val2: ''  },
        { channel: 'Fz',      condition: 'Band um Nominal [±%]', val1: '10', val2: ''  }
    ];

    /* ── State (startet mit Presets) ─────────────────────── */
    let filters = [];
    let smoothings = [];
    let hideUnused = false;
    let htmlComponent = null;

    /* ── ID helper ───────────────────────────────────────── */
    function uid() { return Math.random().toString(36).substr(2, 9); }

    function loadDefaults() {
        filters = DEFAULT_FILTERS.map(f => ({ id: uid(), ...f }));
        smoothings = DEFAULT_SMOOTHINGS.map(s => ({ id: uid(), ...s }));
    }

    /* ── SVG snippets ────────────────────────────────────── */
    const trashSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
    const checkSvg = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

    /* ── Channel <option> list ───────────────────────────── */
    function channelOptions(selected) {
        return CHANNELS.map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`).join('');
    }

    /* ── Render helpers ──────────────────────────────────── */
    function renderFilterCard(f) {
        const cfg = CONDITION_INPUTS[f.condition] || { two: false, ph1: 'value' };
        const condOpts = FILTER_CONDITIONS.map(c =>
            `<option value="${c}"${c === f.condition ? ' selected' : ''}>${c}</option>`).join('');

        return `
        <div class="card" id="fc-${f.id}" data-id="${f.id}">
            <div class="card-top">
                <select class="channel-select" aria-label="Filter channel"
                    onchange="updateFilter('${f.id}','channel',this.value)">${channelOptions(f.channel)}</select>
                <button class="delete-btn" aria-label="Filter entfernen"
                    onclick="removeFilter('${f.id}')">${trashSvg}</button>
            </div>
            <select class="full-select" aria-label="Filterbedingung"
                onchange="updateFilter('${f.id}','condition',this.value)">${condOpts}</select>
            <div class="filter-inputs">
                <input type="text" aria-label="Wert" value="${f.val1}"
                    placeholder="${cfg.ph1}"
                    oninput="updateFilter('${f.id}','val1',this.value)">
                <input type="text" aria-label="Bis" value="${f.val2}" placeholder="${cfg.ph2 || ''}"
                    class="${cfg.two ? '' : 'hidden'}"
                    oninput="updateFilter('${f.id}','val2',this.value)">
            </div>
        </div>`;
    }

    /* Parameter-Labels je Smoothing-Typ (null = Feld ausblenden) */
    function getSmoothingLabels(type) {
        switch (type) {
            case 'Butterworth':    return { lbl1: 'N',   lbl2: 'fc'  };
            case 'Bessel':         return { lbl1: 'N',   lbl2: 'fc'  };
            case 'Savitzky-Golay': return { lbl1: 'Ord', lbl2: 'Fen' };
            case 'Moving Average': return { lbl1: 'Fen', lbl2: null  };
            case 'Median':         return { lbl1: 'Fen', lbl2: null  };
            case 'Hampel':         return { lbl1: 'Fen', lbl2: 'nσ'  };
            default:               return { lbl1: 'P1',  lbl2: 'P2'  };
        }
    }

    function renderSmoothingCard(s) {
        const { lbl1, lbl2 } = getSmoothingLabels(s.type);
        const typeOpts = SMOOTHING_TYPES.map(t =>
            `<option value="${t}"${t === s.type ? ' selected' : ''}>${t}</option>`).join('');

        return `
        <div class="card${s.active ? ' active-border' : ''}" id="sc-${s.id}" data-id="${s.id}">
            <div class="card-divider">
                <div class="card-top-left">
                    <button class="active-toggle${s.active ? ' on' : ''}" aria-pressed="${s.active}"
                        aria-label="${s.channel} Smoothing ${s.active ? 'deaktivieren' : 'aktivieren'}"
                        onclick="toggleSmoothingActive('${s.id}')">${checkSvg}</button>
                    <select class="channel-select${s.active ? '' : ' dimmed'}" aria-label="Smoothing channel"
                        onchange="updateSmoothing('${s.id}','channel',this.value)">${channelOptions(s.channel)}</select>
                </div>
                <button class="delete-btn" aria-label="Smoothing entfernen"
                    onclick="removeSmoothing('${s.id}')">${trashSvg}</button>
            </div>
            <div class="${s.active ? '' : 'inactive-body'}">
                <div class="ttc-select-wrap">
                    <select class="full-select" aria-label="Smoothing-Typ"
                        data-ttc-type="${s.type}"
                        onchange="updateSmoothing('${s.id}','type',this.value);this.dataset.ttcType=this.value">${typeOpts}</select>
                </div>
                <div class="input-pair${lbl2 ? '' : ' single'}">
                    <div class="param-field">
                        <span class="param-label">${lbl1}</span>
                        <input class="param-input" type="text" aria-label="${lbl1}" value="${s.param1}"
                            oninput="updateSmoothing('${s.id}','param1',this.value)">
                    </div>
                    ${lbl2 ? `
                    <div class="param-field">
                        <span class="param-label">${lbl2}</span>
                        <input class="param-input" type="text" aria-label="${lbl2}" value="${s.param2}"
                            oninput="updateSmoothing('${s.id}','param2',this.value)">
                    </div>` : ''}
                </div>
            </div>
        </div>`;
    }

    /* ── Full re-render ──────────────────────────────────── */
    function renderAll() {
        document.getElementById('filterContainer').innerHTML =
            filters.map(renderFilterCard).join('');

        const visible = hideUnused ? smoothings.filter(s => s.active) : smoothings;
        document.getElementById('smoothingContainer').innerHTML =
            visible.map(renderSmoothingCard).join('');

        const track = document.getElementById('unusedTrack');
        track.classList.toggle('on', hideUnused);

        /* Tooltip-Listener nach jedem Re-Render neu binden */
        TTC.attachListeners();
    }

    /* ── Filter actions ──────────────────────────────────── */
    function addFilter() {
        filters.push({ id: uid(), channel: CHANNELS[0], condition: FILTER_CONDITIONS[0], val1: '', val2: '' });
        renderAll();
    }
    function removeFilter(id) {
        filters = filters.filter(f => f.id !== id);
        renderAll();
    }
    function updateFilter(id, field, value) {
        const f = filters.find(f => f.id === id);
        if (!f) return;
        f[field] = value;
        if (field === 'condition') renderAll();
    }

    /* ── Smoothing actions ───────────────────────────────── */
    function addSmoothing() {
        smoothings.push({ id: uid(), channel: CHANNELS[0], active: true, type: SMOOTHING_TYPES[0], param1: '4', param2: '10' });
        renderAll();
    }
    function removeSmoothing(id) {
        smoothings = smoothings.filter(s => s.id !== id);
        renderAll();
    }
    function updateSmoothing(id, field, value) {
        const s = smoothings.find(s => s.id === id);
        if (!s) return;
        s[field] = value;
        if (field === 'type') renderAll();
    }
    function toggleSmoothingActive(id) {
        const s = smoothings.find(s => s.id === id);
        if (!s) return;
        s.active = !s.active;
        renderAll();
    }

    /* ── Preset reset ────────────────────────────────────── */
    function resetToRecommended() {
        loadDefaults();
        renderAll();
    }

    /* ── Unused toggle ───────────────────────────────────── */
    function toggleUnused() {
        hideUnused = !hideUnused;
        renderAll();
    }

    /* ── MATLAB callback ─────────────────────────────────── */
    function sendToMatlab() {
        const dataOut = {
            hideUnused,
            filters: filters.map(f => ({
                parameter: f.channel,
                condition: f.condition,
                val1: parseFloat(f.val1) || 0,
                val2: parseFloat(f.val2) || 0
            })),
            smoothings: smoothings.map(s => ({
                parameter: s.channel,
                active: s.active,
                type: s.type,
                param1: parseFloat(s.param1) || 0,
                param2: parseFloat(s.param2) || 0
            }))
        };
        if (htmlComponent) {
            htmlComponent.Data = dataOut;
        } else {
            console.log('--- TELEMETRY UPDATE ---', JSON.stringify(dataOut, null, 2));
        }
    }

    /* ── Init ────────────────────────────────────────────── */
    function setup(component) { htmlComponent = component; }

    function init() {
        loadDefaults();
        renderAll();
    }

    window.onload = init;


    /* ================================================================
       TTC FILTER TOOLTIP ENGINE
       Namespace: window.TTC
       - TTC.attachListeners()  — nach jedem renderAll() aufrufen
       - Tooltip erscheint nach 3 s Hover über dem Smoothing-Typ-Select
       - Roter Fortschrittsbalken zeigt verbleibende Wartezeit an
       - Animiert durch 4 Parameter-Stufen des jeweiligen Filters
    ================================================================ */
    const TTC = (function () {

        /* ── Signalgenerator (N=80 Samples, deterministisch) ── */
        const N = 80;

        function makeRaw(spiky) {
            const pts = [];
            for (let i = 0; i < N; i++) {
                const t = i / N;
                const v = Math.sin(t * Math.PI * 4 * 2.5) * 0.55
                        + Math.sin(t * Math.PI * 4 * 6.1) * 0.18
                        + (Math.sin(i * 47.3 + 1.1) * 0.5
                           + Math.sin(i * 31.1 + 2.7) * 0.3) * 0.12;
                pts.push(v);
            }
            if (spiky) {
                [10, 28, 52, 70].forEach((idx, k) => {
                    pts[idx] += (k % 2 === 0 ? 1.3 : -1.25);
                });
            }
            return pts;
        }

        function movAvg(data, win) {
            const h = Math.floor(Math.max(1, win) / 2);
            return data.map((_, i) => {
                let s = 0, c = 0;
                for (let j = Math.max(0, i - h); j <= Math.min(N - 1, i + h); j++) { s += data[j]; c++; }
                return s / c;
            });
        }

        function medianFilt(data, win) {
            const h = Math.floor(Math.max(1, win) / 2);
            return data.map((_, i) => {
                const buf = [];
                for (let j = Math.max(0, i - h); j <= Math.min(N - 1, i + h); j++) buf.push(data[j]);
                return buf.sort((a, b) => a - b)[Math.floor(buf.length / 2)];
            });
        }

        function hampelFilt(data, win, nsigma) {
            const h = Math.floor(Math.max(1, win) / 2);
            return data.map((v, i) => {
                const buf = [];
                for (let j = Math.max(0, i - h); j <= Math.min(N - 1, i + h); j++) buf.push(data[j]);
                buf.sort((a, b) => a - b);
                const med = buf[Math.floor(buf.length / 2)];
                const mad = buf.map(x => Math.abs(x - med)).sort((a, b) => a - b)[Math.floor(buf.length / 2)];
                return Math.abs(v - med) > nsigma * 1.4826 * mad ? med : v;
            });
        }

        function savgol(data, win) {
            const h = Math.floor(Math.max(3, win) / 2);
            return data.map((_, i) => {
                let sw = 0, sv = 0;
                for (let j = Math.max(0, i - h); j <= Math.min(N - 1, i + h); j++) {
                    const d = h > 0 ? (j - i) / h : 0;
                    const w = Math.exp(-2.5 * d * d);
                    sw += w; sv += data[j] * w;
                }
                return sv / sw;
            });
        }

        function simulate(type, raw, p) {
            switch (type) {
                case 'Butterworth':    return movAvg(raw, Math.max(2, Math.round((1 / p[1]) * N * 0.38 * (1 + (p[0] - 2) * 0.12))));
                case 'Bessel':         return movAvg(raw, Math.max(2, Math.round((1 / p[1]) * N * 0.35 * (1 + (p[0] - 2) * 0.15))));
                case 'Savitzky-Golay': return savgol(raw, p[1]);
                case 'Moving Average': return movAvg(raw, Math.max(1, p[0]));
                case 'Median':         return medianFilt(raw, Math.max(1, p[0]));
                case 'Hampel':         return hampelFilt(raw, Math.max(1, p[0]), p[1]);
                default:               return raw;
            }
        }

        function toSvgPath(data, W, H, P) {
            const mn = Math.min(...data), mx = Math.max(...data), rng = mx - mn || 1;
            return data.map((v, i) => {
                const x = P + (i / (data.length - 1)) * (W - P * 2);
                const y = P + (1 - (v - mn) / rng) * (H - P * 2);
                return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
            }).join(' ');
        }

        /* ── Filter-Metadaten ──────────────────────────────── */
        const META = {
            'Butterworth': {
                badges: [['IIR', true], ['Max. Flach', false]],
                desc: 'Maximiert die Flachheit im Durchlassband — kein Ripple. <strong>Leichter Phasenverzug</strong> verglichen mit Bessel, aber <strong>steiler Abfall</strong> bei gleicher Ordnung.',
                einsatz: 'Allzweck-Standard: <strong>Fx, Fy, Fz, Mx, Mz</strong>. TTC-Preset: N=4 / fc=5–10 Hz mit filtfilt (Nullphase).',
                params: [['N', '', 'Ordnung'], ['fc', 'Hz', 'Grenzfrequenz']],
                stages: [{ p: [4, 5], note: 'Preset' }, { p: [2, 5], note: '↓N → sanfter' }, { p: [4, 10], note: '↑fc → schärfer' }, { p: [6, 5], note: '↑N → steiler' }],
                spiky: false
            },
            'Bessel': {
                badges: [['IIR', true], ['Linearphasig', false]],
                desc: 'Maximiert die Flachheit der Gruppenlaufzeit → <strong>kein Phasenverzug</strong>. Peaks bleiben zeitlich exakt erhalten, auch bei hohen Filterordnungen.',
                einsatz: 'Wenn die <strong>Lage des Peaks</strong> entscheidend ist: <strong>Fy, Fz, Mx, Mz</strong> — Kennfeld-x-Achse darf keinen Zeitversatz haben.',
                params: [['N', '', 'Ordnung'], ['fc', 'Hz', 'Grenzfrequenz']],
                stages: [{ p: [4, 5], note: 'Preset' }, { p: [2, 5], note: '↓N → sanfter' }, { p: [4, 10], note: '↑fc → schärfer' }, { p: [6, 5], note: '↑N → steiler' }],
                spiky: false
            },
            'Savitzky-Golay': {
                badges: [['FIR', true], ['Polynomfit', false]],
                desc: 'Fittet lokal ein Polynom über <strong>win Samples</strong>. Glättet und erhält dabei <strong>Peak-Amplituden besser als IIR</strong>. Nullphase durch symmetrischen Kern.',
                einsatz: 'Wenn <strong>absolute Kraftpeaks</strong> (Fy_max, Fz_max) exakt sein müssen. Sinnvoll für Post-Processing.',
                params: [['Ord', '', 'Polynom-Grad'], ['Fen', 'S', 'Fensterlänge']],
                stages: [{ p: [3, 11], note: 'Preset' }, { p: [2, 11], note: '↓Ord → sanfter' }, { p: [3, 21], note: '↑Fen → weicher' }, { p: [4, 11], note: '↑Ord → schärfer' }],
                spiky: false
            },
            'Moving Average': {
                badges: [['FIR', true], ['Box-Filter', false]],
                desc: 'Arithmetisches Mittel über ein <strong>Fenster der Breite win</strong>. Einfachster Filter — <strong>reduziert Peak-Amplitude</strong> deutlich bei großen Fenstern.',
                einsatz: 'Langsam veränderliche Signale: <strong>TtreadI, TtreadC, TtreadO, IP</strong>. Nicht für Kraftkanäle.',
                params: [['Fen', 'S', 'Fensterlänge']],
                stages: [{ p: [11], note: 'Preset' }, { p: [21], note: '↑Fen → weicher' }, { p: [51], note: 'Peaks gedämpft' }, { p: [101], note: 'Temp-Preset' }],
                spiky: false
            },
            'Median': {
                badges: [['Nichtlinear', true], ['Impulsrobust', false]],
                desc: 'Ersetzt jeden Wert durch den <strong>Median des Fensters</strong>. Entfernt <strong>Impulsstörungen perfekt</strong> ohne kontinuierliche Peaks zu verschieben.',
                einsatz: 'Winkelkanäle <strong>alpha, kappa</strong> — Encoder-Glitches werden vollständig entfernt.',
                params: [['Fen', 'S', 'Fensterlänge (ungerade)']],
                stages: [{ p: [5], note: 'Preset' }, { p: [3], note: '↓Fen → aggressiver' }, { p: [7], note: '↑Fen → breiter' }, { p: [11], note: 'Kanten verschmiert' }],
                spiky: true
            },
            'Hampel': {
                badges: [['Ausreißer', true], ['MAD-Robust', false]],
                desc: 'Berechnet gleitenden Median + MAD. Ersetzt <strong>nur echte Ausreißer</strong> (> nσ × 1.48 × MAD) — normales Rauschen bleibt unangetastet.',
                einsatz: '<strong>V, omega</strong> — CAN-Bus-Glitches. Deutlich gezielter als Median, erhält die Signaldynamik vollständig.',
                params: [['Fen', 'S', 'Fensterlänge'], ['nσ', '', 'Sigma-Schwelle']],
                stages: [{ p: [7, 3], note: 'Preset' }, { p: [7, 2], note: '↓nσ → mehr entfernt' }, { p: [15, 3], note: '↑Fen → robuster' }, { p: [7, 5], note: '↑nσ → konservativer' }],
                spiky: true
            }
        };

        /* ── Laufende Tooltip-Zustand ────────────────────── */
        let activeTooltip = null;  /* DOM-Element des aktuell sichtbaren Tooltips */
        let hoverRafId    = null;  /* rAF-ID des Fortschrittsbalkens              */
        let hoverStart    = null;  /* Timestamp-Start des Hover                   */
        let activeSel     = null;  /* aktuell gehovertes <select>-Element         */

        const HOVER_DURATION = 3000; /* ms bis Tooltip erscheint */

        /* ── Tooltip bauen ──────────────────────────────── */
        function buildTooltip(type) {
            const d = META[type];
            if (!d) return null;

            const W = 276, H = 68, P = 5;
            const RAW = makeRaw(d.spiky);
            const safeId = type.replace(/[\s\-\.]/g, '_');

            const el = document.createElement('div');
            el.className = 'ttc-tooltip';
            el.innerHTML = `
                <div class="ttc-accent"></div>
                <div class="ttc-header">
                    <span class="ttc-name">${type}</span>
                    ${d.badges.map(([t, r]) =>
                        `<span class="ttc-badge ${r ? 'ttc-badge-red' : 'ttc-badge-gray'}">${t}</span>`
                    ).join('')}
                </div>
                <div class="ttc-body">
                    <div class="ttc-desc">${d.desc}</div>
                    <div class="ttc-ei-label">
                        <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#c72229" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                        Einsatz
                    </div>
                    <div class="ttc-ei-text">${d.einsatz}</div>
                </div>
                <div class="ttc-chart-wrap">
                    <svg width="${W}" height="${H}">
                        ${[0.25, 0.5, 0.75].map(t =>
                            `<line x1="${P}" y1="${(P + t * (H - P * 2)).toFixed(1)}"
                                  x2="${W - P}" y2="${(P + t * (H - P * 2)).toFixed(1)}"
                                  stroke="#1c1c1c" stroke-width="1"/>`
                        ).join('')}
                        <path id="ttcR_${safeId}" fill="none" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
                        <path id="ttcF_${safeId}" fill="none" stroke="#c72229" stroke-width="1.8" stroke-linejoin="round"
                            style="filter:drop-shadow(0 0 3px rgba(199,34,41,.45))"/>
                    </svg>
                </div>
                <div class="ttc-pbar" id="ttcP_${safeId}">
                    ${d.params.map((p, i) => `
                        ${i > 0 ? '<div class="ttc-psep"></div>' : ''}
                        <div class="ttc-pitem">
                            <span class="ttc-pkey">${p[0]}</span>
                            <span class="ttc-pval" id="ttcV${i}_${safeId}">${d.stages[0].p[i]}</span>
                            ${p[1] ? `<span class="ttc-punit">${p[1]}</span>` : ''}
                        </div>
                    `).join('')}
                    <span class="ttc-pnote" id="ttcN_${safeId}">${d.stages[0].note}</span>
                </div>
                <div class="ttc-footer">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span class="ttc-footer-txt">3 s Hover — dann erscheint der Tooltip</span>
                </div>
            `;
            document.body.appendChild(el);

            /* Initiale Chart-Pfade */
            const rawPath  = document.getElementById('ttcR_' + safeId);
            const filtPath = document.getElementById('ttcF_' + safeId);
            if (rawPath)  rawPath.setAttribute('d',  toSvgPath(RAW, W, H, P));
            if (filtPath) filtPath.setAttribute('d', toSvgPath(simulate(type, RAW, d.stages[0].p), W, H, P));

            /* Parameter-Morphing-Animation zwischen den 4 Stufen */
            let stageIdx = 0, nextIdx = 1, stageTs = null, animRafId = null;
            const STAGE_DUR = 2200; /* ms je Stufe */

            function animStep(ts) {
                if (!stageTs) stageTs = ts;
                const cur  = d.stages[stageIdx];
                const next = d.stages[nextIdx];
                const raw  = Math.min((ts - stageTs) / STAGE_DUR, 1);
                const ease = raw < 0.5 ? 2 * raw * raw : -1 + (4 - 2 * raw) * raw;

                /* Gefilterten Pfad morphen */
                const cFilt = simulate(type, RAW, cur.p);
                const nFilt = simulate(type, RAW, next.p);
                const morphed = cFilt.map((v, i) => v + (nFilt[i] - v) * ease);
                if (filtPath) filtPath.setAttribute('d', toSvgPath(morphed, W, H, P));

                /* Parameter-Werte interpolieren */
                d.params.forEach((_, pi) => {
                    const vEl = document.getElementById('ttcV' + pi + '_' + safeId);
                    if (vEl) vEl.textContent = Math.round(cur.p[pi] + (next.p[pi] - cur.p[pi]) * ease);
                });

                /* Stufe wechseln wenn fertig */
                if (raw >= 1) {
                    stageIdx = nextIdx;
                    nextIdx  = (nextIdx + 1) % d.stages.length;
                    stageTs  = ts;
                    const nEl = document.getElementById('ttcN_' + safeId);
                    if (nEl) nEl.textContent = d.stages[stageIdx].note;
                }
                animRafId = requestAnimationFrame(animStep);
            }
            animRafId = requestAnimationFrame(animStep);
            el._ttcStop = () => cancelAnimationFrame(animRafId);
            return el;
        }

        function positionTooltip(el, refEl) {
            const rect = refEl.getBoundingClientRect();
            const TW = 302, TH = 370;
            let left = rect.right + 10;
            if (left + TW > window.innerWidth - 6) left = rect.left - TW - 10;
            let top = rect.top - 10;
            if (top + TH > window.innerHeight - 6) top = window.innerHeight - TH - 6;
            if (top < 6) top = 6;
            el.style.left = left + 'px';
            el.style.top  = top + 'px';
        }

        function hideTooltip() {
            if (activeTooltip) {
                if (activeTooltip._ttcStop) activeTooltip._ttcStop();
                activeTooltip.remove();
                activeTooltip = null;
            }
            if (hoverRafId) { cancelAnimationFrame(hoverRafId); hoverRafId = null; }
            hoverStart = null;
            activeSel  = null;
        }

        /* ── Listener-Bindung nach jedem renderAll() ──────── */
        function attachListeners() {
            /* Alle Wrapper mit Fortschrittsbalken ausstatten */
            document.querySelectorAll('.ttc-select-wrap').forEach(wrap => {
                /* Alten Fortschrittsbalken entfernen */
                wrap.querySelectorAll('.ttc-progress').forEach(b => b.remove());
                const bar = document.createElement('div');
                bar.className = 'ttc-progress';
                wrap.appendChild(bar);

                const sel = wrap.querySelector('select[data-ttc-type]');
                if (!sel) return;

                /* Clone-Trick: alte inline-Handler raus, neue rein */
                const fresh = sel.cloneNode(true);
                sel.parentNode.replaceChild(fresh, sel);
                wrap.appendChild(bar); /* bar bleibt im wrap */

                fresh.addEventListener('mouseenter', function () {
                    if (activeSel === fresh) return; /* bereits aktiv */
                    hideTooltip();
                    activeSel  = fresh;
                    hoverStart = null;
                    bar.style.width = '0%';

                    function tickBar(ts) {
                        if (!hoverStart) hoverStart = ts;
                        const progress = Math.min((ts - hoverStart) / HOVER_DURATION, 1);
                        bar.style.width = (progress * 100) + '%';

                        if (progress < 1) {
                            hoverRafId = requestAnimationFrame(tickBar);
                        } else {
                            hoverRafId = null;
                            /* Tooltip anzeigen */
                            const type = fresh.dataset.ttcType || fresh.value;
                            activeTooltip = buildTooltip(type);
                            if (activeTooltip) {
                                positionTooltip(activeTooltip, fresh);
                                requestAnimationFrame(() => activeTooltip.classList.add('visible'));
                            }
                        }
                    }
                    hoverRafId = requestAnimationFrame(tickBar);
                });

                fresh.addEventListener('mouseleave', function () {
                    bar.style.transition = 'width 0.25s ease';
                    bar.style.width = '0%';
                    setTimeout(() => { bar.style.transition = ''; }, 260);
                    hideTooltip();
                });

                /* data-ttc-type synchron halten bei Wert-Änderung */
                fresh.addEventListener('change', function () {
                    fresh.dataset.ttcType = fresh.value;
                });
            });
        }

        return { attachListeners };
    })();
</script>
</body>
</html>
