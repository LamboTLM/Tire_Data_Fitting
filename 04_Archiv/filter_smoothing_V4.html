<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tire Telemetry Controls</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #111111;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        /* ── Layout ─────────────────────────────── */
        .sidebar {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
            background: #111111;
        }

        /* ── Header ─────────────────────────────── */
        .header {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #151515;
            border-bottom: 1px solid #222;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-icon { color: #c72229; display: flex; align-items: center; }
        .header-title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #f0f0f0;
        }
        .header-settings { color: #555; display: flex; align-items: center; cursor: pointer; }
        .header-settings:hover { color: #888; }

        /* ── Scroll area ─────────────────────────── */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px;
        }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-track { background: #111; }
        .content::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .content::-webkit-scrollbar-thumb:hover { background: #555; }

        /* ── Sections ────────────────────────────── */
        .section { margin-bottom: 28px; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #666;
        }
        .section-title svg { color: #555; }

        /* ── Cards ───────────────────────────────── */
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            padding: 10px;
            margin-bottom: 6px;
            transition: border-color 0.15s;
        }
        .card.active-border { border-color: #3a2020; }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .card-top-left { display: flex; align-items: center; gap: 10px; }

        .card-divider {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        /* ── Inputs / Selects ────────────────────── */
        select, input[type="text"], input[type="number"] {
            background: #111111;
            color: #cccccc;
            border: 1px solid #333;
            border-radius: 2px;
            padding: 4px 7px;
            font-size: 11px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
            appearance: none;
            -webkit-appearance: none;
        }
        select:focus, input:focus { border-color: #c72229; }

        .channel-select {
            background: transparent;
            border: none;
            color: #f0f0f0;
            font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            padding: 0;
            width: 90px;
        }
        .channel-select option { background: #1a1a1a; }

        .channel-select.dimmed { color: #555; }

        .full-select {
            width: 100%;
            padding: 5px 7px;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .full-select option { background: #1a1a1a; }

        .input-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .input-pair.single { grid-template-columns: 1fr; }

        .param-field {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #111;
            border: 1px solid #333;
            border-radius: 2px;
            padding: 0 7px;
            transition: border-color 0.15s;
        }
        .param-field:focus-within { border-color: #c72229; }
        .param-label {
            font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
            font-size: 9px;
            color: #555;
            white-space: nowrap;
            min-width: 18px;
        }
        .param-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #f0f0f0;
            font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
            font-size: 11px;
            padding: 5px 0;
            outline: none;
            width: 100%;
        }

        /* Filter value inputs */
        .filter-inputs { display: flex; gap: 6px; }
        .filter-inputs input {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            border-radius: 2px;
            padding: 5px 7px;
            font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
            font-size: 11px;
            color: #f0f0f0;
            outline: none;
            transition: border-color 0.15s;
        }
        .filter-inputs input:focus { border-color: #c72229; }
        .filter-inputs input.hidden { display: none; }

        /* ── Buttons ─────────────────────────────── */
        .delete-btn {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            padding: 4px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            transition: color 0.15s, background 0.15s;
            line-height: 0;
        }
        .delete-btn:hover { color: #c72229; background: #2a1111; }

        .add-btn {
            width: 100%;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 11px;
            color: #555;
            background: transparent;
            border: 1px dashed #333;
            border-radius: 2px;
            cursor: pointer;
            transition: color 0.15s, background 0.15s, border-color 0.15s;
        }
        .add-btn:hover { color: #ccc; background: #1a1a1a; border-color: #555; }

        /* ── Active toggle (smoothing) ───────────── */
        .active-toggle {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            border: 1px solid #444;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            flex-shrink: 0;
        }
        .active-toggle.on { background: #c72229; border-color: #c72229; }
        .active-toggle svg { display: none; }
        .active-toggle.on svg { display: block; }

        /* ── Inactive overlay ────────────────────── */
        .inactive-body { opacity: 0.4; pointer-events: none; }

        /* ── Unused toggle (pill switch) ─────────── */
        .unused-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .unused-text {
            font-size: 9px;
            color: #555;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.15s;
        }
        .unused-label:hover .unused-text { color: #aaa; }

        .pill-track {
            width: 26px;
            height: 14px;
            border-radius: 7px;
            background: #222;
            border: 1px solid #333;
            position: relative;
            transition: background 0.2s;
        }
        .pill-track.on { background: #3a1a1a; border-color: #c72229; }
        .pill-thumb {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            transition: transform 0.2s, background 0.2s;
        }
        .pill-track.on .pill-thumb { transform: translateX(12px); background: #c72229; }

        /* ── Footer ──────────────────────────────── */
        .footer {
            flex: none;
            padding: 12px 14px;
            background: #151515;
            border-top: 1px solid #222;
        }
        .submit-btn {
            width: 100%;
            background: #c72229;
            color: white;
            border: none;
            border-radius: 2px;
            padding: 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
            box-shadow: 0 0 15px rgba(199,34,41,0.2);
        }
        .submit-btn:hover { background: #e0262e; box-shadow: 0 0 22px rgba(199,34,41,0.4); }
        .submit-btn:active { background: #a51c22; }

        /* ── SVG icons (inline) ──────────────────── */
        .icon { display: inline-flex; align-items: center; }
    </style>
</head>
<body>

<div class="sidebar">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="header-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
            </span>
            <span class="header-title">Tire Telemetry</span>
        </div>
        <span class="header-settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="21" y1="4" x2="7" y2="4"/><line x1="3" y1="4" x2="3" y2="4"/>
                <line x1="21" y1="12" x2="11" y2="12"/><line x1="7" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="20" x2="17" y2="20"/><line x1="13" y1="20" x2="3" y2="20"/>
                <circle cx="3.5" cy="4" r="1.5"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="20" r="2"/>
            </svg>
        </span>
    </div>

    <!-- Scrollable content -->
    <div class="content">

        <!-- FILTER SECTION -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                    </svg>
                    Data Filters
                </span>
            </div>
            <div id="filterContainer"></div>
            <button class="add-btn" onclick="addFilter()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Add Filter
            </button>
        </div>

        <!-- SMOOTHING SECTION -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    Smoothing
                </span>
                <label class="unused-label" onclick="toggleUnused()">
                    <span class="unused-text">Unused</span>
                    <div class="pill-track" id="unusedTrack">
                        <div class="pill-thumb"></div>
                    </div>
                </label>
            </div>
            <div id="smoothingContainer"></div>
            <button class="add-btn" onclick="addSmoothing()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Add Smoothing
            </button>
        </div>

    </div><!-- /content -->

    <!-- Footer -->
    <div class="footer">
        <button class="submit-btn" onclick="sendToMatlab()">Aktualisieren</button>
    </div>
</div>

<script>
    /* ── Constants ───────────────────────────────────────── */
    const CHANNELS = ['alpha','kappa','Fx','Fy','Fz','Mx','Mz','IP','gamma','V','omega','TtreadI','TtreadC','TtreadO'];
    const FILTER_CONDITIONS = ['Lowerbound (>=)','Upperbound (<=)','Bereich [min,max]','Gleich (==)'];
    const SMOOTHING_TYPES = ['Bessel','Savitzky-Golay','Moving Average','Median'];

    /* ── State ───────────────────────────────────────────── */
    let filters = [
        { id: 'f1', channel: 'Fx',    condition: 'Lowerbound (>=)',  val1: '500', val2: '' },
        { id: 'f2', channel: 'alpha', condition: 'Bereich [min,max]', val1: '-10', val2: '10' }
    ];
    let smoothings = [
        { id: 's1', channel: 'Fz',    active: true,  type: 'Bessel',        param1: '4',  param2: '15' },
        { id: 's2', channel: 'kappa', active: false, type: 'Moving Average', param1: '10', param2: '' }
    ];
    let hideUnused = false;
    let htmlComponent = null;

    /* ── ID helper ───────────────────────────────────────── */
    function uid() { return Math.random().toString(36).substr(2, 9); }

    /* ── SVG snippets ────────────────────────────────────── */
    const trashSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
    const checkSvg = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

    /* ── Channel <option> list ───────────────────────────── */
    function channelOptions(selected) {
        return CHANNELS.map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`).join('');
    }

    /* ── Render helpers ──────────────────────────────────── */
    function renderFilterCard(f) {
        const isBereich = f.condition === 'Bereich [min,max]';
        const condOpts = FILTER_CONDITIONS.map(c =>
            `<option value="${c}"${c === f.condition ? ' selected' : ''}>${c}</option>`).join('');

        return `
        <div class="card" id="fc-${f.id}" data-id="${f.id}">
            <div class="card-top">
                <select class="channel-select" aria-label="Filter channel"
                    onchange="updateFilter('${f.id}','channel',this.value)">${channelOptions(f.channel)}</select>
                <button class="delete-btn" aria-label="Filter entfernen"
                    onclick="removeFilter('${f.id}')">${trashSvg}</button>
            </div>
            <select class="full-select" aria-label="Filterbedingung"
                onchange="updateFilter('${f.id}','condition',this.value)">${condOpts}</select>
            <div class="filter-inputs">
                <input type="text" aria-label="Wert" value="${f.val1}"
                    placeholder="${isBereich ? 'min' : 'value'}"
                    oninput="updateFilter('${f.id}','val1',this.value)">
                <input type="text" aria-label="Bis" value="${f.val2}" placeholder="max"
                    class="${isBereich ? '' : 'hidden'}"
                    oninput="updateFilter('${f.id}','val2',this.value)">
            </div>
        </div>`;
    }

    function getSmoothing2ndLabel(type) {
        if (type === 'Bessel') return 'fc';
        if (type === 'Savitzky-Golay') return 'Fen';
        return null;
    }

    function renderSmoothingCard(s) {
        const lbl1 = s.type === 'Bessel' ? 'N' : s.type === 'Savitzky-Golay' ? 'Ord' : 'Fen';
        const lbl2 = getSmoothing2ndLabel(s.type);
        const typeOpts = SMOOTHING_TYPES.map(t =>
            `<option value="${t}"${t === s.type ? ' selected' : ''}>${t}</option>`).join('');

        return `
        <div class="card${s.active ? ' active-border' : ''}" id="sc-${s.id}" data-id="${s.id}">
            <div class="card-divider">
                <div class="card-top-left">
                    <button class="active-toggle${s.active ? ' on' : ''}" aria-pressed="${s.active}"
                        aria-label="${s.channel} Smoothing ${s.active ? 'deaktivieren' : 'aktivieren'}"
                        onclick="toggleSmoothingActive('${s.id}')">${checkSvg}</button>
                    <select class="channel-select${s.active ? '' : ' dimmed'}" aria-label="Smoothing channel"
                        onchange="updateSmoothing('${s.id}','channel',this.value)">${channelOptions(s.channel)}</select>
                </div>
                <button class="delete-btn" aria-label="Smoothing entfernen"
                    onclick="removeSmoothing('${s.id}')">${trashSvg}</button>
            </div>
            <div class="${s.active ? '' : 'inactive-body'}">
                <select class="full-select" aria-label="Smoothing-Typ"
                    onchange="updateSmoothing('${s.id}','type',this.value)">${typeOpts}</select>
                <div class="input-pair${lbl2 ? '' : ' single'}">
                    <div class="param-field">
                        <span class="param-label">${lbl1}</span>
                        <input class="param-input" type="text" aria-label="${lbl1}" value="${s.param1}"
                            oninput="updateSmoothing('${s.id}','param1',this.value)">
                    </div>
                    ${lbl2 ? `
                    <div class="param-field">
                        <span class="param-label">${lbl2}</span>
                        <input class="param-input" type="text" aria-label="${lbl2}" value="${s.param2}"
                            oninput="updateSmoothing('${s.id}','param2',this.value)">
                    </div>` : ''}
                </div>
            </div>
        </div>`;
    }

    /* ── Full re-render ──────────────────────────────────── */
    function renderAll() {
        document.getElementById('filterContainer').innerHTML =
            filters.map(renderFilterCard).join('');

        const visible = hideUnused ? smoothings.filter(s => s.active) : smoothings;
        document.getElementById('smoothingContainer').innerHTML =
            visible.map(renderSmoothingCard).join('');

        const track = document.getElementById('unusedTrack');
        track.classList.toggle('on', hideUnused);
    }

    /* ── Filter actions ──────────────────────────────────── */
    function addFilter() {
        filters.push({ id: uid(), channel: CHANNELS[0], condition: FILTER_CONDITIONS[0], val1: '', val2: '' });
        renderAll();
    }
    function removeFilter(id) {
        filters = filters.filter(f => f.id !== id);
        renderAll();
    }
    function updateFilter(id, field, value) {
        const f = filters.find(f => f.id === id);
        if (!f) return;
        f[field] = value;
        if (field === 'condition') renderAll(); // need to show/hide second input
    }

    /* ── Smoothing actions ───────────────────────────────── */
    function addSmoothing() {
        smoothings.push({ id: uid(), channel: CHANNELS[0], active: true, type: SMOOTHING_TYPES[0], param1: '2', param2: '10' });
        renderAll();
    }
    function removeSmoothing(id) {
        smoothings = smoothings.filter(s => s.id !== id);
        renderAll();
    }
    function updateSmoothing(id, field, value) {
        const s = smoothings.find(s => s.id === id);
        if (!s) return;
        s[field] = value;
        if (field === 'type') renderAll(); // labels and param count change
    }
    function toggleSmoothingActive(id) {
        const s = smoothings.find(s => s.id === id);
        if (!s) return;
        s.active = !s.active;
        renderAll();
    }

    /* ── Unused toggle ───────────────────────────────────── */
    function toggleUnused() {
        hideUnused = !hideUnused;
        renderAll();
    }

    /* ── MATLAB callback ─────────────────────────────────── */
    function sendToMatlab() {
        const dataOut = {
            hideUnused,
            filters: filters.map(f => ({
                parameter: f.channel,
                condition: f.condition,
                val1: parseFloat(f.val1) || 0,
                val2: parseFloat(f.val2) || 0
            })),
            smoothings: smoothings.map(s => ({
                parameter: s.channel,
                active: s.active,
                type: s.type,
                param1: parseFloat(s.param1) || 0,
                param2: parseFloat(s.param2) || 0
            }))
        };
        if (htmlComponent) {
            htmlComponent.Data = dataOut;
        } else {
            console.log('--- TELEMETRY UPDATE ---', JSON.stringify(dataOut, null, 2));
        }
    }

    /* ── Init ────────────────────────────────────────────── */
    // MATLAB ruft beim Laden automatisch eine globale Funktion namens
    // "setup" auf und übergibt die HTML-Component-Referenz.
    function setup(component) {
        htmlComponent = component;
    }

    function init() {
        renderAll();
    }

    window.onload = init;
</script>
</body>
</html>
