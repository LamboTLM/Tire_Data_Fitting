<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Controls</title>
    <style>
        /* Flexibler Dark Mode für schmale Sidebars */
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 6px;
            font-size: 11px;
            width: 100%; /* Dynamische Skalierung für MATLAB */
            height: 100%;
            overflow-x: hidden;
        }

        h3 {
            color: #c72229; /* Dynamics e.V. Rot */
            border-bottom: 1px solid #3e3e42;
            padding-bottom: 2px;
            margin: 10px 0 6px 0;
            font-size: 12px;
            font-weight: 600;
        }

        .panel-section { margin-bottom: 12px; }

        /* Kompakte Eingabefelder */
        select, input[type="number"] {
            background-color: #2d2d2d;
            color: #cccccc;
            border: 1px solid #454545;
            border-radius: 3px;
            padding: 3px;
            font-size: 11px;
            width: 100%;
            margin-bottom: 4px;
        }
        select:focus, input:focus { outline: none; border-color: #007acc; }

        /* Karten-Design */
        .item-card {
            background-color: #252526;
            border: 1px solid #3e3e42;
            border-radius: 3px;
            padding: 5px;
            margin-bottom: 6px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #4fc1ff;
            margin-bottom: 4px;
        }

        /* Buttons */
        .delete-btn {
            background-color: #c72229;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 9px;
            padding: 1px 4px;
        }
        .delete-btn:hover { background-color: #e82c34; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 6px 0;
            font-size: 10px;
        }
        .checkbox-container input { margin: 0; }

        .input-group {
            display: flex;
            gap: 2px;
            align-items: center;
        }
        .input-label {
            font-size: 9px;
            color: #858585;
            min-width: 18px;
        }

        .submit-btn {
            background-color: #007acc;
            color: white;
            border: 1px solid #005f9e;
            border-radius: 3px;
            padding: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            font-size: 11px;
        }
        .submit-btn:hover { background-color: #0098ff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="panel-section">
        <h3>Filter</h3>
        <select id="filterAddSelect">
            <option value="">+ Parameter...</option>
        </select>
        <div id="filterRowsContainer"></div>
        <div class="checkbox-container">
            <input type="checkbox" id="hideUnusedCheckbox" checked>
            <label for="hideUnusedCheckbox">Ungenutzte ausblenden</label>
        </div>
    </div>

    <div class="panel-section">
        <h3>Smoothing</h3>
        <select id="smoothingAddSelect">
            <option value="">+ Parameter...</option>
        </select>
        <div id="smoothingRowsContainer"></div>
    </div>

    <button class="submit-btn" onclick="sendToMatlab()">Aktualisieren</button>

    <script>
        const knownChannels = ['alpha', 'kappa', 'Fx', 'Fy', 'Fz', 'Mx', 'Mz', 'IP', 'gamma', 'V', 'omega', 'TtreadI', 'TtreadC', 'TtreadO'];
        const filterConditions = ['Lowerbound (>=)', 'Upperbound (<=)', 'Bereich [min,max]', 'Gleich (==)'];
        const smoothingTypes = ['Bessel', 'Moving Average', 'Savitzky-Golay', 'Median'];
        let htmlComponent = null;

        // MATLAB ruft beim Laden automatisch eine globale Funktion namens
        // "setup" auf und übergibt die HTML-Component-Referenz.
        function setup(component) {
            htmlComponent = component;
        }

        function init() {
            const fSel = document.getElementById('filterAddSelect');
            const sSel = document.getElementById('smoothingAddSelect');
            knownChannels.forEach(ch => { fSel.add(new Option(ch, ch)); sSel.add(new Option(ch, ch)); });

            fSel.addEventListener('change', (e) => { if(e.target.value) { addFilterCard(e.target.value); e.target.value=""; } });
            sSel.addEventListener('change', (e) => { if(e.target.value) { addSmoothingCard(e.target.value); e.target.value=""; } });
        }

        function addFilterCard(param) {
            const container = document.getElementById('filterRowsContainer');
            const card = document.createElement('div');
            card.className = 'item-card filter-card';
            card.dataset.param = param;
            let condOpts = filterConditions.map(c => `<option value="${c}">${c}</option>`).join('');

            card.innerHTML = `
                <div class="card-header">
                    <span>${param}</span>
                    <button class="delete-btn" onclick="this.closest('.item-card').remove()">X</button>
                </div>
                <select class="cond-select" onchange="toggleFilterInputs(this)">${condOpts}</select>
                <input type="number" class="val1" value="0">
                <input type="number" class="val2 hidden" value="0" placeholder="bis">
            `;
            container.appendChild(card);
        }

        function toggleFilterInputs(select) {
            const val2 = select.closest('.item-card').querySelector('.val2');
            if(select.value === 'Bereich [min,max]') {
                val2.classList.remove('hidden');
                val2.style.marginTop = "4px";
            } else { val2.classList.add('hidden'); }
        }

        function addSmoothingCard(param) {
            const container = document.getElementById('smoothingRowsContainer');
            const card = document.createElement('div');
            card.className = 'item-card smoothing-card';
            card.dataset.param = param;
            let typeOpts = smoothingTypes.map(t => `<option value="${t}">${t}</option>`).join('');

            card.innerHTML = `
                <div class="card-header">
                    <label style="display:flex; align-items:center; gap:3px; color:#4fc1ff;">
                        <input type="checkbox" class="active-chk" checked> ${param}
                    </label>
                    <button class="delete-btn" onclick="this.closest('.item-card').remove()">X</button>
                </div>
                <select class="type-select" onchange="updateSmoothingFields(this)">${typeOpts}</select>
                <div class="input-group">
                    <span class="lbl1 input-label">N:</span>
                    <input type="number" class="param1" value="4">
                </div>
                <div class="input-group p2-group" style="margin-top:4px;">
                    <span class="lbl2 input-label">fc:</span>
                    <input type="number" class="param2" value="5">
                </div>
            `;
            container.appendChild(card);
            updateSmoothingFields(card.querySelector('.type-select'));
        }

        function updateSmoothingFields(select) {
            const card = select.closest('.item-card');
            const lbl1 = card.querySelector('.lbl1'), lbl2 = card.querySelector('.lbl2'), p2Group = card.querySelector('.p2-group');
            switch(select.value) {
                case 'Bessel': lbl1.innerText = 'N:'; lbl2.innerText = 'fc:'; p2Group.classList.remove('hidden'); break;
                case 'Savitzky-Golay': lbl1.innerText = 'Ord:'; lbl2.innerText = 'Fen:'; p2Group.classList.remove('hidden'); break;
                case 'Moving Average':
                case 'Median': lbl1.innerText = 'Fen:'; p2Group.classList.add('hidden'); break;
            }
        }

        function sendToMatlab() {
            const dataOut = { hideUnused: document.getElementById('hideUnusedCheckbox').checked, filters: [], smoothings: [] };

            document.querySelectorAll('.filter-card').forEach(card => {
                dataOut.filters.push({
                    parameter: card.dataset.param,
                    condition: card.querySelector('.cond-select').value,
                    val1: parseFloat(card.querySelector('.val1').value) || 0,
                    val2: parseFloat(card.querySelector('.val2').value) || 0
                });
            });

            document.querySelectorAll('.smoothing-card').forEach(card => {
                dataOut.smoothings.push({
                    parameter: card.dataset.param,
                    active: card.querySelector('.active-chk').checked,
                    type: card.querySelector('.type-select').value,
                    param1: parseFloat(card.querySelector('.param1').value) || 0,
                    param2: parseFloat(card.querySelector('.param2').value) || 0
                });
            });

            if (htmlComponent) { htmlComponent.Data = dataOut; }
        }

        window.onload = init;
    </script>
</body>
</html>
